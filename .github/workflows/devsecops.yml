name: "DevSecOps CI/CD Pipeline (AWS ECS Fargate)"

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  id-token: write       # Essential for AWS IAM OIDC keyless authentication
  contents: read        # Read repository code
  security-events: write # Upload SARIF findings to GitHub Security tab
  actions: read

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "overflow-ledger-service"
  ECS_CLUSTER: "overflow-production-cluster"
  ECS_SERVICE: "overflow-ledger-service"
  ECS_TASK_DEFINITION: "task-definition.json"
  CONTAINER_NAME: "overflow-app"

jobs:
  # ========================================================
  # STAGE 1: Secret Scanning & Shift-Left Code Security
  # ========================================================
  secret-scan:
    name: "1. Secret Detection (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ========================================================
  # STAGE 2: Static Application Security Testing (SAST)
  # ========================================================
  sast-scan:
    name: "2. SAST Analysis (Semgrep OWASP Top 10)"
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
          generateSarif: "semgrep.sarif"

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "semgrep.sarif"

  # ========================================================
  # STAGE 3: Dependency Vulnerability Scanning (SCA) & Unit Tests
  # ========================================================
  sca-and-test:
    name: "3. Dependency Audit (Trivy SCA) & Tests"
    runs-on: ubuntu-latest
    needs: [sast-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Unit Tests & Health Probes
        run: |
          pytest tests/ -v

      - name: Run Trivy Dependency Scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-sca.sarif"

      - name: Upload SCA SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-sca.sarif"

  # ========================================================
  # STAGE 4: Container Build & Image Vulnerability Scan
  # ========================================================
  container-security:
    name: "4. Container Build & CVE Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [sca-and-test]
    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Semantic Image Tag
        id: build-image
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="${TIMESTAMP}-${SHA_SHORT}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          docker build -t overflow-ledger:${IMAGE_TAG} .

      - name: Scan Container Image with Trivy (Fail on CRITICAL CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "overflow-ledger:${{ steps.build-image.outputs.image_tag }}"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Set to 1 to strictly block pipeline on Critical CVEs

      - name: Upload Container SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image.sarif"

  # ========================================================
  # STAGE 5: Cryptographic Container Signing (Cosign) & ECS Deploy
  # ========================================================
  deploy-production:
    name: "5. Cosign Signing & ECS Fargate Zero-Downtime Deploy"
    runs-on: ubuntu-latest
    needs: [container-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cosign (Sigstore Cryptographic Signer)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Configure AWS Credentials via OIDC (No Static IAM Keys!)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: "github-actions-overflow-deploy"
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.container-security.outputs.image_tag }}
        run: |
          docker tag overflow-ledger:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker tag overflow-ledger:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

      - name: Sign Container Image (Keyless OIDC Attestation)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.container-security.outputs.image_tag }}
          COSIGN_YES: "true"
        run: |
          cosign sign ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Download Active ECS Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition > task-definition.json

      - name: Render New Image in Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.container-security.outputs.image_tag }}

      - name: Deploy to AWS ECS Fargate (Rolling Deployment + Auto-Rollback)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10
